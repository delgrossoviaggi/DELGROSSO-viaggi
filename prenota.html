<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prenota | Del Grosso Viaggi</title><link rel="stylesheet" href="assets/pro.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.booking{max-width:760px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow)}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}.field input,.field select,.field textarea{width:100%;padding:14px 15px;border:1px solid #dce4eb;border-radius:14px;font:inherit;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.seat{padding:11px 5px;border:1px solid #d8e0e8;background:#f8fafc;border-radius:10px;font-weight:900;cursor:pointer}.seat.selected{background:var(--blue);color:#fff;border-color:var(--blue)}.seat.occupied{background:#fee2e2;color:#b91c1c;cursor:not-allowed}.notice{padding:13px;border-radius:12px;background:#eef7ff;color:#0a4f88;font-size:12px;line-height:1.5;margin:14px 0}</style></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/logo.JPEG" alt="Del Grosso Viaggi"></a><button class="mobile-toggle">☰</button><nav class="navlinks"><a href="index.html">Home</a><a href="viaggi.html">Partenze</a><a href="flotta.html">La Flotta</a><a href="partyontheroad.html">Party</a><a href="contatti.html">Contatti</a><a class="navcta" href="prenota.html">Prenota</a></nav></div></header><main><section class="page-hero"><div class="wrap"><div class="eyebrow">Prenotazione online</div><h1>Prenota<br>il tuo posto.</h1><p>Seleziona la partenza, scegli i posti disponibili e inviaci la richiesta.</p></div></section><section class="section"><div class="wrap"><form id="booking" class="booking"><div class="field"><label>Viaggio</label><select id="viaggio" required><option value="">Caricamento...</option></select></div><div id="details" class="notice">Seleziona una partenza per vedere i posti.</div><div class="field"><label>Posti</label><div id="seats" class="seats"></div><input type="hidden" id="posti"></div><div class="field"><label>Nome e cognome</label><input id="cliente" required></div><div class="field"><label>Telefono</label><input id="telefono" required inputmode="tel"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Note</label><textarea id="note" rows="3"></textarea></div><button class="btn btn-blue" style="width:100%">Invia prenotazione</button><div id="msg" class="notice" style="display:none"></div></form></div></section></main><footer><div class="wrap copyright"><span>© 2026 Del Grosso Viaggi</span><span>Travel with experience.</span></div></footer><script src="js/site.js"></script><script>
(async()=>{
 const sel=document.querySelector('#viaggio'),seats=document.querySelector('#seats'),details=document.querySelector('#details'),msg=document.querySelector('#msg');
 let current=null,selected=[];
 const {data,error}=await gestSb.from('viaggi').select('*').eq('pubblicato','SI').order('data_partenza',{ascending:true});
 if(error){sel.innerHTML='<option>Errore caricamento</option>';return;}
 (data||[]).forEach(v=>{const o=document.createElement('option');o.value=v.id;o.textContent=`${fmtDate(v.data_partenza)} · ${v.titolo||v.destinazione}`;sel.appendChild(o)});
 const qs=new URLSearchParams(location.search).get('viaggio');if(qs)sel.value=qs;
 async function load(){
  current=(data||[]).find(v=>v.id===sel.value);selected=[];seats.innerHTML='';document.querySelector('#posti').value='';
  if(!current)return;
  details.textContent=`${current.luogo_partenza||'Partenza'} · ${current.ora_partenza||''} · € ${Number(current.prezzo||0).toFixed(0)} a persona`;
  let occupied=[];
  try{const r=await gestSb.rpc('get_public_booked_seats',{p_viaggio_id:current.id}); if(!r.error) occupied=Array.isArray(r.data)?r.data:(r.data?.posti||[]);}catch(e){}
  const occ=new Set((occupied||[]).map(x=>String(x).trim()).filter(Boolean));
  for(let i=1;i<=Number(current.posti_totali||53);i++){
   const b=document.createElement('button');b.type='button';b.className='seat'+(occ.has(String(i))?' occupied':'');b.textContent=i;
   if(!occ.has(String(i))) b.onclick=()=>{if(selected.includes(String(i)))selected=selected.filter(x=>x!==String(i));else selected.push(String(i));b.classList.toggle('selected');document.querySelector('#posti').value=selected.join(', ')}; else b.disabled=true;
   seats.appendChild(b);
  }
 }
 sel.onchange=load;await load();
 document.querySelector('#booking').onsubmit=async e=>{
  e.preventDefault();
  if(!selected.length){alert('Seleziona almeno un posto.');return;}
  msg.style.display='block';msg.textContent='Invio in corso…';
  const parts=document.querySelector('#cliente').value.trim().split(/\s+/);
  const nome=parts.shift()||'';const cognome=parts.join(' ');
  const {error}=await gestSb.rpc('create_public_booking',{
   p_viaggio_id:current.id,p_nome:nome,p_cognome:cognome,p_telefono:document.querySelector('#telefono').value.trim(),
   p_email:document.querySelector('#email').value.trim()||null,p_note:document.querySelector('#note').value.trim()||null,p_posti:selected
  });
  if(error){console.error(error);msg.textContent='Non è stato possibile inviare la prenotazione. Riprova o contattaci.';return;}
  msg.textContent='Prenotazione inviata correttamente. Ti contatteremo per la conferma.';
  e.target.reset();selected=[];await load();
 };
})();</script></body></html>
