<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prenota Viaggio - Del Grosso Gestionale v1.0</title>
  <style>
    .prenota-form-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .prenota-header {
      margin-bottom: 30px;
    }

    .prenota-header h1 {
      margin: 0 0 10px;
      color: var(--brand, #0f4c81);
    }

    .prenota-header p {
      margin: 0;
      color: var(--text-muted, #666);
    }

    .prenota-form-card {
      background: var(--surface, #ffffff);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    html.dark .prenota-form-card {
      background: var(--surface, #1e1e1e);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .prenota-form-section {
      margin-bottom: 25px;
    }

    .prenota-form-section:last-child {
      margin-bottom: 0;
    }

    .prenota-form-section h3 {
      margin: 0 0 15px;
      font-size: 16px;
      font-weight: 600;
      color: var(--brand, #0f4c81);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-row.full {
      grid-template-columns: 1fr;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text, #333);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    html.dark .form-group label {
      color: var(--text, #fff);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 10px 12px;
      border: 1px solid var(--border, #ddd);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: var(--input-bg, #ffffff);
      color: var(--text, #333);
      transition: all 0.2s ease;
    }

    html.dark .form-group input,
    html.dark .form-group select,
    html.dark .form-group textarea {
      background: var(--input-bg, #2a2a2a);
      color: var(--text, #fff);
      border-color: var(--border, #444);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--brand, #0f4c81);
      box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.1);
    }

    html.dark .form-group input:focus,
    html.dark .form-group select:focus,
    html.dark .form-group textarea:focus {
      box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.3);
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    .prenota-actions {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      justify-content: space-between;
    }

    .prenota-actions button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .prenota-actions button.primary {
      background: var(--brand, #0f4c81);
      color: white;
    }

    .prenota-actions button.primary:hover {
      background: var(--brand-dark, #0a3560);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(15, 76, 129, 0.3);
    }

    .prenota-actions button.secondary {
      background: var(--bg, #f5f5f5);
      color: var(--text, #333);
      border: 1px solid var(--border, #ddd);
    }

    html.dark .prenota-actions button.secondary {
      background: var(--bg, #2a2a2a);
      color: var(--text, #fff);
      border-color: var(--border, #444);
    }

    .prenota-actions button.secondary:hover {
      background: var(--bg-hover, #efefef);
    }

    html.dark .prenota-actions button.secondary:hover {
      background: var(--bg-hover, #3a3a3a);
    }

    .price-summary {
      background: var(--bg, #f5f5f5);
      border-left: 4px solid var(--brand, #0f4c81);
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    html.dark .price-summary {
      background: var(--bg, #2a2a2a);
    }

    .price-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price-item label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted, #666);
    }

    html.dark .price-item label {
      color: var(--text-muted, #aaa);
    }

    .price-item value {
      font-size: 16px;
      font-weight: 700;
      color: var(--brand, #0f4c81);
    }

    @media (max-width: 768px) {
      .prenota-form-wrapper {
        padding: 10px;
      }

      .prenota-form-card {
        padding: 20px;
      }

      .prenota-actions {
        flex-direction: column;
      }

      .prenota-actions button {
        width: 100%;
      }

      .price-summary {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <link rel="modulepreload" crossorigin href="./assets/qrBookingUtils-DHAR6Vrm.js">
  <link rel="modulepreload" crossorigin href="./assets/seatAssignmentService-0MTjkiXK.js">
  <link rel="modulepreload" crossorigin href="./assets/browser-Bi1SjHOd.js">
  <link rel="modulepreload" crossorigin href="./assets/jspdf.es.min-DT2zzJUL.js">
  <link rel="modulepreload" crossorigin href="./assets/pdfReceiptService-M28dXixt.js">

<meta name="apple-mobile-web-app-capable" content="yes">

</head>
<body>
  <div class="prenota-form-wrapper">
    <div class="prenota-header">
      <h1>📋 Prenota il tuo Viaggio</h1>
      <p>Compila il modulo, seleziona i tuoi posti e completa la prenotazione</p>
    </div>

    <div class="prenota-form-card">
      <!-- Dati Cliente -->
      <div class="prenota-form-section">
        <h3>Dati Passeggero</h3>
        <div class="form-row">
          <div class="form-group">
            <label for="cliente">Nome Completo *</label>
            <input id="cliente" type="text" placeholder="Mario Rossi" required>
          </div>
          <div class="form-group">
            <label for="telefono">Telefono *</label>
            <input id="telefono" type="tel" placeholder="+39 333 1234567" required>
          </div>
          <div class="form-group">
            <label for="email">Email *</label>
            <input id="email" type="email" placeholder="mario@example.com" required>
          </div>
        </div>
      </div>

      <!-- Selezione Viaggio e Posti -->
      <div class="prenota-form-section">
        <h3>Viaggio e Posti</h3>
        <div class="form-row">
          <div class="form-group full">
            <label for="viaggioId">Seleziona Viaggio *</label>
            <select id="viaggioId" required></select>
          </div>
        </div>
        <div id="seatMapContainer"></div>
      </div>

      <!-- Riepilogo Prezzi -->
      <div class="price-summary">
        <div class="price-item">
          <label>Posti:</label>
          <value id="postiDisplay">0</value>
        </div>
        <div class="price-item">
          <label>Importo Totale:</label>
          <value id="importoDisplay">€ 0,00</value>
        </div>
        <div class="price-item">
          <label>Acconto:</label>
          <value id="accontoDisplay">€ 0,00</value>
        </div>
        <div class="price-item">
          <label>Saldo:</label>
          <value id="saldoDisplay">€ 0,00</value>
        </div>
      </div>

      <!-- Dati Pagamento e Note -->
      <div class="prenota-form-section">
        <h3>Dati Pagamento e Note</h3>
        <div class="form-row">
          <div class="form-group">
            <label for="importo">Importo Totale € *</label>
            <input id="importo" type="number" min="0" step="0.01" value="0" required>
          </div>
          <div class="form-group">
            <label for="acconto">Acconto € (opzionale)</label>
            <input id="acconto" type="number" min="0" step="0.01" value="0">
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label for="note">Note Speciali (opzionale)</label>
            <textarea id="note" placeholder="Es. Esigenze dietetiche, allergie, preferenze posti..."></textarea>
          </div>
        </div>
      </div>

      <!-- Azioni -->
      <div class="prenota-actions">
        <button id="goTrips" type="button" class="secondary">← Torna ai Viaggi</button>
        <button id="submitPrenota" type="button" class="primary">✓ Conferma Prenotazione</button>
        <button id="goBookings" type="button" class="secondary">Vai a Prenotazioni →</button>
      </div>
    </div>
  </div>

</body>
</html>
