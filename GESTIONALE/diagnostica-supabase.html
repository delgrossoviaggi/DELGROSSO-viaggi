<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostica Supabase · Del Grosso</title><link rel="stylesheet" href="./assets/dg-v208-operational-sync.css"><script src="./assets/dg-v208-operational-sync.js"></script><style>body{font-family:system-ui;margin:0;background:#f3f6fa;color:#102033;padding:24px}.box{max-width:900px;margin:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 35px #0001}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{padding:16px;border:1px solid #dde5ee;border-radius:14px}.n{font-size:30px;font-weight:900}.ok{color:#0a9b62}.err{color:#c62828}button{padding:11px 15px;border:0;border-radius:10px;background:#0f4c81;color:#fff;font-weight:800;cursor:pointer}</style></head><body><div class="box"><h1>🔧 Diagnostica Gestionale V209</h1><p>Connessione diretta al Supabase del Gestionale. Questa pagina non modifica dati.</p><div id="status">Verifica…</div><div class="grid" id="grid"></div><p><button id="sync">↻ Sincronizza ora</button></p><pre id="detail" style="white-space:pre-wrap"></pre></div><script>function render(s){document.getElementById('status').innerHTML=s?.ok?'<strong class="ok">● SUPABASE ONLINE</strong>':'<strong class="err">● SUPABASE OFFLINE / ERRORE</strong>';const c=s?.counts||{};document.getElementById('grid').innerHTML=['prenotazioni','flotta','viaggi','clienti','pagamenti'].map(k=>`<div class="card"><small>${k}</small><div class="n">${c[k]??'—'}</div></div>`).join('');document.getElementById('detail').textContent=JSON.stringify(s,null,2)}window.addEventListener('dg:live:status',e=>render(e.detail));document.getElementById('sync').onclick=()=>window.DG_SUPABASE_SYNC?.pullAll();setTimeout(()=>render(window.DG_SUPABASE_SYNC?.getStatus?.()||{}),1000);</script><script src="./assets/dg-v208-page-bridge.js"></script></body></html>
