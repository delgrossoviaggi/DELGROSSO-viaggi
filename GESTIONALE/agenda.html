>
<script src="./assets/dg-v82-fortress.js?v=86"></script><script>
(()=>{const q=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let db;const init=async()=>{db=window.DG_SUPABASE_SYNC;await load();};const load=async()=>{try{const c=await db.getClient();const [a,s]=await Promise.all([c.from('attivita_gestionale').select('*').neq('stato','completata').order('scadenza',{ascending:true,nullsFirst:false}).limit(100),c.from('scadenze_gestionale').select('*').neq('stato','completata').order('data_scadenza',{ascending:true}).limit(100)]);if(a.error)throw a.error;if(s.error)throw s.error;renderTasks(a.data||[]);renderDue(s.data||[]);}catch(e){q('#taskList').innerHTML='<div class="dg-empty">Impossibile caricare le attività.</div>';q('#dueList').innerHTML='<div class="dg-empty">Impossibile caricare le scadenze.</div>';}}
const renderTasks=rows=>{const today=new Date().toISOString().slice(0,10);q('#kOpen').textContent=rows.length;q('#kUrgent').textContent=rows.filter(x=>x.priorita==='urgente').length;q('#kDue').textContent=rows.filter(x=>x.scadenza&&x.scadenza<=today).length;q('#taskList').innerHTML=rows.length?rows.map(r=>`<div class="dg-item"><div><strong>${esc(r.titolo)} <span class="dg-badge ${r.priorita==='urgente'?'urgent':r.priorita==='alta'?'high':''}">${esc(r.priorita||'normale')}</span></strong><small>${esc(r.scadenza||'Nessuna scadenza')}</small></div><button type="button" data-task="${esc(r.id)}">✓ Completa</button></div>`).join(''):'<div class="dg-empty">Nessuna attività aperta 🎯</div>';q('#taskList').querySelectorAll('[data-task]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const c=await db.getClient();const r=await c.from('attivita_gestionale').update({stato:'completata',completata_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',b.dataset.task);if(r.error)throw r.error;await load()}catch(e){b.disabled=false;alert(e.message||'Operazione non riuscita')}})};
const renderDue=rows=>{q('#dueList').innerHTML=rows.length?rows.map(r=>`<div class="dg-item"><div><strong>${esc(r.titolo)} <span class="dg-badge">${esc(r.tipo||'operativa')}</span></strong><small>${esc(r.data_scadenza)}${r.importo!=null?' · € '+Number(r.importo||0).toFixed(2):''}</small></div><button type="button" data-due="${esc(r.id)}">✓ Completa</button></div>`).join(''):'<div class="dg-empty">Nessuna scadenza aperta 🎯</div>';q('#dueList').querySelectorAll('[data-due]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const c=await db.getClient();const r=await c.from('scadenze_gestionale').update({stato:'completata',completata_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',b.dataset.due);if(r.error)throw r.error;await load()}catch(e){b.disabled=false;alert(e.message||'Operazione non riuscita')}})};
q('#taskForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const c=await db.getClient();const r=await c.from('attivita_gestionale').insert({titolo:q('#taskTitle').value.trim(),priorita:q('#taskPriority').value,scadenza:q('#taskDate').value||null,stato:'aperta'});if(r.error)throw r.error;e.target.reset();await load()}catch(x){alert(x.message||'Salvataggio non riuscito')}finally{b.disabled=false}};
q('#dueForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const c=await db.getClient();const r=await c.from('scadenze_gestionale').insert({titolo:q('#dueTitle').value.trim(),tipo:q('#dueType').value,data_scadenza:q('#dueDate').value,stato:'aperta',priorita:'normale'});if(r.error)throw r.error;e.target.reset();await load()}catch(x){alert(x.message||'Salvataggio non riuscito')}finally{b.disabled=false}};q('#refreshTasks').onclick=load;q('#refreshDue').onclick=load;init();})();</script><script src="./assets/dg-v84-black-text.js?v=86"></script>
