<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accedi | Del Grosso Gestionale</title>
<link rel="icon" href="./favicon.png">
<link rel="stylesheet" href="css/accessibility.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<main class="login-shell">
  <section class="brand-panel">
    <div class="brand-overlay"></div>
    <div class="brand-content">
      <img class="brand-logo" data-runtime-logo src="./assets/images/logo.JPEG" alt="Del Grosso Viaggi & Limousine Bus">
      <p class="brand-kicker">Travel operations suite</p>
      <h1><span data-runtime-company-name>Del Grosso Viaggi</span><br>Gestionale</h1>
      <p class="brand-copy">Organizza viaggi, prenotazioni e flotta da un unico spazio sicuro.</p>
    </div>
    <footer>© 2026 <span data-runtime-company-name>Del Grosso Viaggi &amp; Limousine Bus</span></footer>
  </section>
  <section class="access-panel">
    <div class="login-card">
      <p class="eyebrow">Area riservata</p>
      <h2>Bentornato.</h2>
      <p class="intro">Accedi al tuo spazio operativo.</p>
      <form id="loginForm" novalidate>
        <label for="username">Email o username</label>
        <input id="username" placeholder="nome@azienda.it" autocomplete="username" aria-label="Email o username">
        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" type="password" placeholder="Inserisci la password" autocomplete="current-password" aria-label="Password">
          <button id="togglePassword" type="button" class="password-toggle" aria-label="Mostra password">Mostra</button>
        </div>
        <div class="login-options">
          <label class="remember"><input id="rememberMe" type="checkbox"> Ricordami</label>
          <a href="#msg" class="forgot-password">Password dimenticata?</a>
        </div>
        <button type="submit" class="submit-login"><span class="button-label">Accedi</span><span class="button-loader" hidden></span></button>
      </form>
      <div id="msg" role="alert" aria-live="polite"></div>
    </div>
  </section>
</main>
<script type="module" src="js/backButton.js"></script>
<script type="module" src="js/login.js"></script>
</body>
</html>
