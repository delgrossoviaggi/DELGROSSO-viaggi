<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurazione Amministratori · Del Grosso Gestionale</title><link rel="stylesheet" href="./assets/dg-v54-executive.css"><style>body{min-height:100vh;margin:0;background:#f3f7fb;color:#10243a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.setup{max-width:860px;margin:50px auto;padding:28px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:24px;padding:30px;box-shadow:0 18px 50px rgba(15,39,65,.08)}h1{margin:0 0 10px}.sub{color:#61758a;margin-bottom:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:8px}.field label{font-weight:700}.field input{min-height:46px;border:1px solid #ccd9e5;border-radius:12px;padding:0 13px;font-size:15px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:#0b5ea8;color:#fff}.secondary{background:#edf4fa;color:#17466c}.result{margin-top:20px;padding:16px;border-radius:14px;background:#f5f8fb;white-space:pre-wrap}.ok{border-left:4px solid #159957}.err{border-left:4px solid #d14343}@media(max-width:700px){.grid{grid-template-columns:1fr}.setup{margin:20px auto;padding:14px}}</style></head><body><main class="setup"><div class="card"><h1>Configurazione Amministratori</h1><p class="sub">Crea gli account Supabase Auth che avranno accesso completo al Gestionale. Nicola e Raffaele sono entrambi amministratori.</p><div class="grid"><div><h3>Nicola</h3><div class="field"><label>Email</label><input id="nEmail" value="nicola@delgrossoviaggi.it" autocomplete="email"><label>Password</label><input id="nPass" type="password" autocomplete="new-password"></div></div><div><h3>Raffaele</h3><div class="field"><label>Email</label><input id="rEmail" value="raffaele@delgrossoviaggi.it" autocomplete="email"><label>Password</label><input id="rPass" type="password" autocomplete="new-password"></div></div></div><div class="actions"><button class="btn primary" id="create">Crea/attiva amministratori</button><button class="btn secondary" id="login">Vai al Login</button></div><div id="result" class="result">Nessuna operazione eseguita.</div></div></main><script type="module">const URL='https://chkuayhbmitdmzmmvona.supabase.co',KEY='sb_publishable_H29K1BV5ZE1rT8xo0PIzVA_wF6zC7je';const sb=(await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm')).createClient(URL,KEY,{auth:{persistSession:false}});const out=document.getElementById('result');async function one(email,password,nome,username){if(!password||password.length<8)throw new Error(`${nome}: password minima 8 caratteri.`);const {data,error}=await sb.auth.signUp({email,password,options:{data:{nome,username,ruolo:'admin'}}});if(error){if(String(error.message).toLowerCase().includes('already registered'))return `${nome}: account già presente in Supabase Auth.`;throw error}return data.user?`${nome}: account creato (${data.user.email}). ${data.session?'Sessione disponibile.':'Se la conferma email è attiva, conferma l’indirizzo prima del login.'}`:`${nome}: registrazione inviata.`}document.getElementById('create').onclick=async()=>{out.className='result';out.textContent='Creazione in corso...';try{const a=await one(document.getElementById('nEmail').value.trim(),document.getElementById('nPass').value,'Nicola Pio','Nicola');const b=await one(document.getElementById('rEmail').value.trim(),document.getElementById('rPass').value,'Raffaele','Raffaele');out.className='result ok';out.textContent=`${a}\n${b}\n\nOra puoi usare il Login.`}catch(e){out.className='result err';out.textContent=e?.message||String(e)}};document.getElementById('login').onclick=()=>location.href='./login.html';</script></body></html>
