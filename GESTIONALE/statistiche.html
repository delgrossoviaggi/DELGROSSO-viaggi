<h1><i class="fa-solid fa-chart-column" aria-hidden="true"></i> Report e Statistiche</h1>
 
<div class="filters">
<label class="sr-only" for="dateFrom">Data iniziale</label>
<input id="dateFrom" type="date" aria-label="Data iniziale">
<label class="sr-only" for="dateTo">Data finale</label>
<input id="dateTo" type="date" aria-label="Data finale">
<label class="sr-only" for="periodo">Periodo</label>
<select id="periodo" aria-label="Periodo">
<option>Tutti i report</option>
<option>Incassi</option>
<option>Prenotazioni</option>
<option>Passeggeri</option>
<option>Clienti</option>
<option>Viaggi</option>
<option>Flotta</option>
</select>
<button id="generateReport">Genera Report</button>
</div>

<div class="cards">
<div class="card"><h3>Incassi</h3><span id="incassi">€ 0,00</span></div>
<div class="card"><h3>Prenotazioni</h3><span id="pren">0</span></div>
<div class="card"><h3>Passeggeri</h3><span id="pass">0</span></div>
<div class="card"><h3>Clienti</h3><span id="cli">0</span></div>
<div class="card"><h3>Viaggi</h3><span id="via">0</span></div>
</div>

<canvas id="reportChart"></canvas>

<div class="grid">
<div class="panel">
<h2>Report Disponibili</h2>
<table id="reportTable">
<thead><tr><th>Metrica</th><th>Valore</th></tr></thead>
<tbody></tbody>
</table>
</div>

<div class="panel">
<h2>Esportazioni</h2>
<button id="exportPdf"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i> PDF</button>
<button id="exportExcel"><i class="fa-solid fa-file-excel" aria-hidden="true"></i> Excel</button>
<button id="exportCsv"><i class="fa-solid fa-file-csv" aria-hidden="true"></i> CSV</button>
<button id="exportPrint">Stampa</button>
</div>
</div>
