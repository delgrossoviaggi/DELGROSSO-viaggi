<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DELGROSSO — Ripristino iPhone</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061a2d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
.box{width:min(430px,100%);background:#fff;color:#10233a;border-radius:24px;padding:28px;box-sizing:border-box;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
h1{font-size:24px;margin:0 0 10px}p{color:#63738a;line-height:1.45}.ok{font-weight:800;color:#0878e5}
button{width:100%;border:0;border-radius:12px;padding:14px;background:#0878e5;color:#fff;font-size:16px;font-weight:800}
</style>
</head>
<body>
<div class="box">
<h1>Ripristino Gestionale 📱</h1>
<p id="msg">Pulizia della vecchia versione iPhone in corso…</p>
<button id="go" style="display:none">Apri il gestionale</button>
</div>
<script>
(async()=>{
 const msg=document.getElementById('msg'),go=document.getElementById('go');
 try{
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(r=>{
       try{
         const u=(r.scope||'');
         if(u.includes('/GESTIONALE/')||location.pathname.includes('/GESTIONALE/')) return r.unregister();
       }catch(e){}
       return Promise.resolve();
     }));
   }
   if(window.caches){
     const keys=await caches.keys();
     await Promise.all(keys.filter(k=>/^delgrosso-gestionale-/i.test(k)).map(k=>caches.delete(k)));
   }
   try{
     Object.keys(localStorage).filter(k=>/^dg_(?!auth)/i.test(k)).forEach(k=>localStorage.removeItem(k));
   }catch(e){}
   msg.innerHTML='<span class="ok">Pulizia completata.</span><br>Ora apro una copia nuova del gestionale.';
   const target='./index.html?iphone_recovery=8&ts='+Date.now();
   setTimeout(()=>location.replace(target),900);
   go.style.display='block'; go.onclick=()=>location.replace(target);
 }catch(e){
   msg.textContent='Pulizia completata parzialmente. Premi il pulsante per aprire il gestionale.';
   go.style.display='block';
   go.onclick=()=>location.replace('./index.html?iphone_recovery=8&ts='+Date.now());
 }
})();
</script>
</body>
</html>
