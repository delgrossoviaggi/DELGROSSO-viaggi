<body class="dg-v65-page dg-v75-app">
<h1>Gestione Flotta</h1>

<div class="toolbar">
  <label class="sr-only" for="fleetSearch">Cerca mezzo</label>
  <input id="fleetSearch" type="search" placeholder="Cerca per targa, marca, modello..." aria-label="Cerca mezzo">
  <button id="fleetReloadButton" type="button">Aggiorna</button>
  <button id="fleetNewButton" type="button">+ Nuovo Mezzo</button>
</div>

<table id="fleetTable">
  <thead>
    <tr>
      <th>Immagine</th>
      <th>Targa</th>
      <th>Marca</th>
      <th>Modello</th>
      <th>Categoria</th>
      <th>Anno</th>
      <th>Posti</th>
      <th>Stato</th>
      <th>Attivo</th>
      <th>Azioni</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<section class="cards">
  <div class="card">
    <h3>Statistiche</h3>
    <p>Totale mezzi: <span id="fleetTotal">0</span></p>
    <p>Mezzi attivi: <span id="fleetActive">0</span></p>
    <p>Fuori servizio: <span id="fleetOutOfService">0</span></p>
  </div>
</section>

<div id="flottaModal" class="modal" style="display:none" aria-hidden="true">
  <div class="content">
    <h2 id="fleetModalTitle">Nuovo Mezzo</h2>
    <form id="fleetForm" novalidate>
      <input id="fleetId" type="hidden">

      <label for="fleetTarga">Targa</label>
      <input id="fleetTarga" name="targa" maxlength="20" autocomplete="off">

      <label for="fleetMarca">Marca</label>
      <input id="fleetMarca" name="marca" maxlength="80" autocomplete="off">

      <label for="fleetModello">Modello</label>
      <input id="fleetModello" name="modello" maxlength="80" autocomplete="off">

      <label for="fleetCategoria">Categoria</label>
      <select id="fleetCategoria" name="categoria"></select>

      <label for="fleetAnno">Anno</label>
      <input id="fleetAnno" name="anno" type="number" min="1900" max="2100" inputmode="numeric">

      <label for="fleetPosti">Posti</label>
      <input id="fleetPosti" name="posti" type="number" min="1" max="999" inputmode="numeric">

      <label for="fleetStato">Stato</label>
      <select id="fleetStato" name="stato"></select>

      <label for="fleetDescrizione">Descrizione</label>
      <textarea id="fleetDescrizione" name="descrizione" rows="4"></textarea>

      <label for="fleetImageInput">Immagine</label>
      <input id="fleetImageInput" type="file" accept="image/*">
      <div style="margin:8px 0">
        <img id="fleetImagePreview" alt="Anteprima immagine mezzo" style="max-width:220px;max-height:140px;display:none;border-radius:6px;border:1px solid #ddd">
      </div>
      <button id="fleetRemoveImageButton" type="button" style="display:none;margin-bottom:8px">Rimuovi immagine</button>

      <label style="display:flex;align-items:center;gap:10px;margin-top:8px">
        <input id="fleetAttivo" name="attivo" type="checkbox" checked>
        Mezzo attivo
      </label>

      <div class="actions">
        <button id="fleetSaveButton" type="submit">Salva</button>
        <button id="fleetCancelButton" type="button">Chiudi</button>
      </div>
    </form>
  </div>
</div>
