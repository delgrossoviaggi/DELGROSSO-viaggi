<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Modifica Viaggio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>✏️ Modifica Viaggio</h1>

<input id="titolo" placeholder="Titolo">
<input id="destinazione" placeholder="Destinazione">
<input id="data" type="date">
<input id="prezzo" placeholder="Prezzo">

<select id="stato">
<option value="bozza">Bozza</option>
<option value="pubblicato">Pubblicato</option>
<option value="soldout">Sold Out</option>
</select>

<input id="locandina" placeholder="URL Locandina">

<button onclick="salvaModifiche()">SALVA MODIFICHE</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/modifica-viaggio.js"></script>

</body>
</html>
