<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Pubblica Viaggio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>🚍 Pubblica Viaggio sul Sito</h1>

<input id="titolo" placeholder="Titolo viaggio">

<select id="stato">

</select>

<button onclick="salvaPubblicazione()">PUBBLICA VIAGGIO</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
