<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestione Mezzi</title>
<link rel="stylesheet" href="css/fix.css">
</head>
<body>
<div class="box">
<h1>🚌 Gestione Mezzi</h1>

<input id="nome" placeholder="Nome mezzo">
<input id="tipo" placeholder="Tipo mezzo">
<input id="posti" type="number" placeholder="Posti">
<input id="foto" placeholder="URL Foto">

<select id="stato">
<option value="Disponibile">Disponibile</option>
<option value="Manutenzione">Manutenzione</option>
</select>

<button onclick="salvaMezzo()">💾 Salva mezzo</button>

<div id="lista"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/gestione-mezzi.js"></script>
</body>
</html>
