<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin SITO · Del Grosso</title><link rel="stylesheet" href="css/site.css"></head><body class="admin-wrap"><div class="admin"><div class="admin-top"><div><div class="kicker">DEL GROSSO</div><h1>Admin SITO</h1></div><button id="logout" class="outline">Esci</button></div><section id="login" class="admin-card"><h2>Accesso area riservata</h2><form id="loginForm"><label>Password</label><input id="password" type="password" autocomplete="off"><button class="cta" style="margin-top:15px">Entra nell'Admin</button></form><div id="msg" class="admin-msg">Inserisci la password per accedere.</div></section><main id="app" class="hidden"><section class="admin-grid"><div class="admin-stat"><span>Media</span><strong id="s1">0</strong></div><div class="admin-stat"><span>Flotta</span><strong id="s2">0</strong></div><div class="admin-stat"><span>Carousel</span><strong id="s3">0</strong></div><div class="admin-stat"><span>Gallery</span><strong id="s4">0</strong></div></section><section class="admin-card" style="margin-top:15px"><h2>Foto & Media</h2><form id="mediaForm"><label>Sezione</label><select id="mediaCat"><option value="carousel">Carousel Home</option><option value="fleet">Flotta</option><option value="gallery">Gallery</option><option value="party">Party</option><option value="posters">Locandine</option></select><label>Titolo</label><input id="mediaTitle" placeholder="Es. Napoli 2026"><label>Foto</label><input id="mediaFiles" type="file" accept="image/*" multiple><button class="cta" style="margin-top:15px">Carica e pubblica</button></form></section><section class="admin-card" style="margin-top:15px"><h2>Nuovo mezzo in Flotta</h2><form id="fleetForm"><label>Nome mezzo</label><input name="titolo" required placeholder="IRIZAR SCANIA PB B"><label>Categoria</label><input name="categoria" placeholder="Bus GT"><label>Posti</label><input name="posti" type="number" placeholder="63"><label>Descrizione</label><input name="descrizione" placeholder="Descrizione del mezzo"><label>Foto (anche multiple)</label><input id="fleetFiles" type="file" accept="image/*" multiple required><button class="cta" style="margin-top:15px">Pubblica mezzo</button></form></section></main></div><script type="module" src="js/admin.js"></script></body></html>
