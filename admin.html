<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07090c"><link rel="icon" href="favicon.png"><link rel="stylesheet" href="css/public-site-v9.css"><title>Admin · DELGROSSO Viaggi</title></head><body><main><section class="hero" style="padding:45px 0 30px"><div class="container"><div class="eyebrow">Area riservata</div><h1>Gestione <span>Sito.</span></h1></div></section><section id="login" class="section"><div class="container form-wrap"><div class="panel"><h2>Accesso Admin</h2><form id="loginForm" class="form"><div class="field full"><label>Email</label><input id="email" type="email" required></div><div class="field full"><label>Password</label><input id="password" type="password" required></div><div class="field full"><button class="btn">Accedi</button></div></form><div id="loginMsg" class="notice hidden"></div></div></div></section><section id="app" class="hidden"><div class="admin-layout"><aside class="sidebar"><button class="active" data-tab="dashboard">Dashboard</button><button data-tab="flotta">Flotta</button><button data-tab="tratte">Partenze</button><button data-tab="gallery">Gallery</button><button data-tab="carousel">Carousel Home</button><button data-tab="carouselFleet">Carousel Flotta</button><button data-tab="info">Storia</button><button id="logout">Esci</button></aside><div class="admin-main"><section class="tab" id="dashboard"><div class="stats"><div class="stat"><small>Flotta sito</small><strong id="sf">0</strong></div><div class="stat"><small>Partenze</small><strong id="st">0</strong></div><div class="stat"><small>Gallery</small><strong id="sg">0</strong></div><div class="stat"><small>Prenotazioni</small><strong id="sp">0</strong></div></div></section><section class="tab hidden" id="flotta"><div class="panel"><h2>Flotta pubblica</h2><form id="fleetForm" class="form"><div class="field"><label>Titolo</label><input id="ftit" required></div><div class="field"><label>Immagine principale</label><input id="fimg" type="file" accept="image/*"></div><div class="field full"><label>Descrizione</label><textarea id="fdesc"></textarea></div><div class="field full"><label>Foto aggiuntive</label><input id="fphotos" type="file" accept="image/*" multiple></div><div class="field full"><button class="btn">Carica e pubblica mezzo</button></div></form><div id="fleetUploadPreview" class="upload-preview"></div><div class="table-wrap"><table class="table"><thead><tr><th>Mezzo</th><th>Foto</th><th></th></tr></thead><tbody id="fleetBody"></tbody></table></div></div></section><section class="tab hidden" id="tratte"><div class="panel"><h2>Partenze pubbliche</h2><form id="tripForm" class="form"><div class="field"><label>Titolo</label><input id="ttit" required></div><div class="field"><label>Data</label><input id="tdate" type="date"></div><div class="field"><label>Modello bus</label><input id="tbus"></div><div class="field"><label>Immagine</label><input id="timg" type="file" accept="image/*"></div><div class="field full"><button class="btn">Carica e pubblica partenza</button></div></form><div class="table-wrap"><table class="table"><thead><tr><th>Titolo</th><th>Data</th><th></th></tr></thead><tbody id="tripBody"></tbody></table></div></div></section><section class="tab hidden" id="gallery"><div class="panel"><h2>Gallery eventi</h2><form id="galleryForm" class="form"><div class="field"><label>Titolo</label><input id="gtit" required></div><div class="field"><label>Data evento</label><input id="gdate" type="date"></div><div class="field full"><label>Foto</label><input id="gphotos" type="file" accept="image/*" multiple></div><div class="field full"><button class="btn">Carica gallery</button></div></form><div id="galleryBody" class="gallery"></div></div></section><section class="tab hidden" id="carousel"><div class="panel"><h2>Carousel Home</h2><form id="carouselForm"><div class="field"><label>Nuove foto</label><input id="cphotos" type="file" accept="image/*" multiple></div><br><button class="btn">Carica carousel</button></form><div id="carouselBody" class="gallery" style="margin-top:20px"></div></div></section><section class="tab hidden" id="carouselFleet"><div class="panel"><h2>Carousel Flotta</h2><form id="carouselFleetForm"><div class="field"><label>Foto</label><input id="cfphotos" type="file" accept="image/*" multiple></div><br><button class="btn">Aggiungi foto</button></form><div id="carouselFleetBody" class="gallery" style="margin-top:20px"></div></div></section><section class="tab hidden" id="info"><div class="panel"><h2>Storia azienda</h2><form id="infoForm"><div class="field"><textarea id="story"></textarea></div><br><button class="btn">Salva</button></form></div></section></div></div></section></main><div id="toast" class="toast hidden"></div><script type="module">import{SITE_URL,SITE_KEY,siteFetch,insertRow,updateRow,deleteRow,esc,allImages,setAccessToken}from'./js/site-api.js';import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient(SITE_URL,SITE_KEY),CLOUD='dubkmnnkl',PRESET='delgrosso_unsigned',$=id=>document.getElementById(id);const toast=t=>{const x=$('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2600)};async function upload(file){if(!file)return null;if(file.size>20*1024*1024)throw Error('File troppo grande (max 20 MB).');if(!file.type.startsWith('image/'))throw Error('Seleziona un file immagine.');const fd=new FormData();fd.append('file',file);fd.append('upload_preset',PRESET);const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`,{method:'POST',body:fd});const d=await r.json();if(!r.ok||!d.secure_url)throw Error(d?.error?.message||`Cloudinary HTTP ${r.status}`);return d.secure_url}async function uploads(files){return Promise.all([...files].map(upload))}async function stats(){const[f,t,g,p]=await Promise.all([siteFetch('flotta_page'),siteFetch('tratte'),siteFetch('gallery_eventi'),siteFetch('prenotazioni')]);$('sf').textContent=f.length;$('st').textContent=t.length;$('sg').textContent=g.length;$('sp').textContent=p.length)}async function fleet(){const d=await siteFetch('flotta_page',{order:'created_at.asc'});$('fleetBody').innerHTML=d.map(x=>`<tr><td><strong>${esc(x.titolo)}</strong></td><td>${allImages(x).length}</td><td><button class="mini danger" data-del="${x.id}">Elimina</button></td></tr>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Eliminare questo mezzo?')){await deleteRow('flotta_page',b.dataset.del);await fleet();await stats()}})}async function trips(){const d=await siteFetch('tratte',{order:'data_partenza.asc'});$('tripBody').innerHTML=d.map(x=>`<tr><td>${esc(x.titolo)}</td><td>${esc(x.data_partenza||'-')}</td><td><button class="mini danger" data-dt="${x.id}">Elimina</button></td></tr>`).join('');document.querySelectorAll('[data-dt]').forEach(b=>b.onclick=async()=>{if(confirm('Eliminare?')){await deleteRow('tratte',b.dataset.dt);await trips();await stats()}})}async function gallery(){const d=await siteFetch('gallery_eventi',{order:'created_at.desc'});$('galleryBody').innerHTML=d.flatMap(x=>x.foto_urls||[]).slice(0,24).map(u=>`<img data-lightbox src="${esc(u)}" alt="">`).join('')}async function carousel(){const d=await siteFetch('carousel_home',{limit:1});$('carouselBody').innerHTML=(d[0]?.foto_urls||[]).map(u=>`<img src="${esc(u)}" alt="">`).join('')}async function carouselFleet(){const d=await siteFetch('carousel_flotta',{order:'created_at.desc'});$('carouselFleetBody').innerHTML=d.map(x=>`<img src="${esc(x.immagine_url)}" alt="${esc(x.titolo||'')}">`).join('')}async function initApp(){const{data:{session}}=await sb.auth.getSession();if(!session)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');setAccessToken(session.access_token);await Promise.all([stats(),fleet(),trips(),gallery(),carousel(),carouselFleet()]);const info=await siteFetch('info_azienda',{limit:1});$('story').value=info[0]?.storia||''}document.querySelectorAll('.sidebar button[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden');document.querySelectorAll('.sidebar button[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('loginForm').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').classList.remove('hidden');$('loginMsg').textContent=error.message}else initApp()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('fleetForm').onsubmit=async e=>{e.preventDefault();try{const main=await upload($('fimg').files[0]);const extras=await uploads($('fphotos').files);const urls=[main,...extras].filter(Boolean);await insertRow('flotta_page',{titolo:$('ftit').value.trim(),descrizione:$('fdesc').value.trim(),immagine_url:main,foto_urls:urls,foto_gallery:urls});toast('Mezzo pubblicato sul Supabase del sito');e.target.reset();await fleet();await stats()}catch(err){toast(err.message)}};$('tripForm').onsubmit=async e=>{e.preventDefault();try{const img=await upload($('timg').files[0]);await insertRow('tratte',{titolo:$('ttit').value.trim(),data_partenza:$('tdate').value||null,modello_bus:$('tbus').value.trim()||null,immagine_url:img});toast('Partenza pubblicata');e.target.reset();await trips();await stats()}catch(err){toast(err.message)}};$('galleryForm').onsubmit=async e=>{e.preventDefault();try{const urls=await uploads($('gphotos').files);await insertRow('gallery_eventi',{titolo:$('gtit').value.trim(),data_evento:$('gdate').value||null,foto_urls:urls});toast('Gallery pubblicata');e.target.reset();await gallery();await stats()}catch(err){toast(err.message)}};$('carouselForm').onsubmit=async e=>{e.preventDefault();try{const urls=await uploads($('cphotos').files);const old=await siteFetch('carousel_home',{limit:1});const prev=old[0]?.foto_urls||[];const p={foto_urls:[...prev,...urls]};if(old[0])await updateRow('carousel_home',old[0].id,p);else await insertRow('carousel_home',p);toast('Carousel Home aggiornato');e.target.reset();await carousel()}catch(err){toast(err.message)}};$('carouselFleetForm').onsubmit=async e=>{e.preventDefault();try{const urls=await uploads($('cfphotos').files);for(const u of urls)await insertRow('carousel_flotta',{titolo:'Flotta DELGROSSO',immagine_url:u});toast('Carousel Flotta aggiornato');e.target.reset();await carouselFleet()}catch(err){toast(err.message)}};$('infoForm').onsubmit=async e=>{e.preventDefault();try{const old=await siteFetch('info_azienda',{limit:1});if(old[0])await updateRow('info_azienda',old[0].id,{storia:$('story').value});else await insertRow('info_azienda',{storia:$('story').value});toast('Storia salvata')}catch(err){toast(err.message)}};initApp();</script></body></html>
