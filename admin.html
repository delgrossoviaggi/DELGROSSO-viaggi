<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Sito · DELGROSSO</title><link rel="stylesheet" href="css/public-site-v8.css"><link rel="icon" href="favicon.png"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><img src="assets/images/logo-sidebar.png" alt="DELGROSSO"></a><strong>ADMIN SITO</strong><a class="btn" href="index.html">Sito pubblico</a></div></header><main class="admin"><div class="container"><section id="login" class="panel login-box"><div class="brand-center"><img src="assets/images/logo-sidebar.png" alt="DELGROSSO"></div><h2>Accesso area riservata</h2><p class="muted">Accesso tramite Supabase Auth del progetto SITO. Il Gestionale non viene utilizzato.</p><form id="loginForm" class="form"><div class="field full"><label>Email</label><input id="email" type="email" required></div><div class="field full"><label>Password</label><input id="password" type="password" required></div><div class="field full"><button class="btn">Accedi</button><div id="loginMsg" class="notice hidden"></div></div></form></section><section id="app" class="hidden"><div class="admin-grid"><aside class="sidebar"><button class="active" data-tab="dashboard">Dashboard</button><button data-tab="flotta">Flotta</button><button data-tab="tratte">Partenze</button><button data-tab="gallery">Gallery</button><button data-tab="carousel">Carousel Home</button><button data-tab="info">Info azienda</button><button id="logout">Esci</button></aside><div><section class="tab" id="dashboard"><div class="stats"><div class="stat"><small>Flotta sito</small><strong id="sf">0</strong></div><div class="stat"><small>Partenze</small><strong id="st">0</strong></div><div class="stat"><small>Gallery</small><strong id="sg">0</strong></div><div class="stat"><small>Prenotazioni</small><strong id="sp">0</strong></div></div></section><section class="tab hidden" id="flotta"><div class="panel"><h2>Flotta pubblica</h2><form id="fleetForm" class="form"><div class="field"><label>Titolo</label><input id="ftit" required></div><div class="field"><label>Immagine URL</label><input id="fimg"></div><div class="field full"><label>Descrizione</label><textarea id="fdesc"></textarea></div><div class="field full"><label>Foto aggiuntive (una URL per riga)</label><textarea id="fphotos"></textarea></div><div class="field full"><button class="btn">Aggiungi mezzo</button></div></form><div class="table-wrap"><table class="table"><thead><tr><th>Mezzo</th><th>Foto</th><th></th></tr></thead><tbody id="fleetBody"></tbody></table></div></div></section><section class="tab hidden" id="tratte"><div class="panel"><h2>Partenze pubbliche</h2><form id="tripForm" class="form"><div class="field"><label>Titolo</label><input id="ttit" required></div><div class="field"><label>Data</label><input id="tdate" type="date"></div><div class="field"><label>Modello bus</label><input id="tbus"></div><div class="field"><label>Immagine URL</label><input id="timg"></div><div class="field full"><button class="btn">Aggiungi partenza</button></div></form><div class="table-wrap"><table class="table"><thead><tr><th>Titolo</th><th>Data</th><th></th></tr></thead><tbody id="tripBody"></tbody></table></div></div></section><section class="tab hidden" id="gallery"><div class="panel"><h2>Gallery eventi</h2><form id="galleryForm" class="form"><div class="field"><label>Titolo</label><input id="gtit" required></div><div class="field"><label>Data evento</label><input id="gdate" type="date"></div><div class="field full"><label>URL foto, una per riga</label><textarea id="gphotos"></textarea></div><div class="field full"><button class="btn">Salva gallery</button></div></form><div id="galleryBody" class="gallery"></div></div></section><section class="tab hidden" id="carousel"><div class="panel"><h2>Carousel Home</h2><form id="carouselForm"><div class="field"><label>URL foto, una per riga</label><textarea id="cphotos"></textarea></div><br><button class="btn">Salva carousel</button></form></div></section><section class="tab hidden" id="info"><div class="panel"><h2>Storia azienda</h2><form id="infoForm"><div class="field"><textarea id="story"></textarea></div><br><button class="btn">Salva</button></form></div></section></div></div></section></div></main><div id="toast" class="toast hidden"></div><script type="module">import{SITE_URL,SITE_KEY,siteFetch,insertRow,updateRow,deleteRow,esc,allImages,setAccessToken}from'./js/site-api.js';import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient(SITE_URL,SITE_KEY),$=id=>document.getElementById(id),toast=t=>{$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2400)};async function stats(){const [f,t,g,p]=await Promise.all([siteFetch('flotta_page'),siteFetch('tratte'),siteFetch('gallery_eventi'),siteFetch('prenotazioni')]);$('sf').textContent=f.length;$('st').textContent=t.length;$('sg').textContent=g.length;$('sp').textContent=p.length}async function fleet(){const d=await siteFetch('flotta_page',{order:'created_at.asc'});$('fleetBody').innerHTML=d.map(x=>`<tr><td><strong>${esc(x.titolo)}</strong></td><td>${allImages(x).length}</td><td><button class="mini danger" data-del="${x.id}">Elimina</button></td></tr>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Eliminare?')){await deleteRow('flotta_page',b.dataset.del);fleet();stats()}})}async function trips(){const d=await siteFetch('tratte',{order:'data_partenza.asc'});$('tripBody').innerHTML=d.map(x=>`<tr><td>${esc(x.titolo)}</td><td>${esc(x.data_partenza||'-')}</td><td><button class="mini danger" data-dt="${x.id}">Elimina</button></td></tr>`).join('');document.querySelectorAll('[data-dt]').forEach(b=>b.onclick=async()=>{if(confirm('Eliminare?')){await deleteRow('tratte',b.dataset.dt);trips();stats()}})}async function gallery(){const d=await siteFetch('gallery_eventi',{order:'created_at.desc'});$('galleryBody').innerHTML=d.flatMap(x=>x.foto_urls||[]).slice(0,24).map(u=>`<img src="${esc(u)}" alt="">`).join('')}async function initApp(){const{data:{session}}=await sb.auth.getSession();if(!session){$('login').classList.remove('hidden');return}setAccessToken(session.access_token);$('login').classList.add('hidden');$('app').classList.remove('hidden');await Promise.all([stats(),fleet(),trips(),gallery()]);const info=await siteFetch('info_azienda',{limit:1});$('story').value=info[0]?.storia||'';const car=await siteFetch('carousel_home',{limit:1});$('cphotos').value=(car[0]?.foto_urls||[]).join('\n')}document.querySelectorAll('.sidebar button[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden');document.querySelectorAll('.sidebar button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('loginForm').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').classList.remove('hidden');$('loginMsg').textContent=error.message}else initApp()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('fleetForm').onsubmit=async e=>{e.preventDefault();await insertRow('flotta_page',{titolo:$('ftit').value,descrizione:$('fdesc').value,immagine_url:$('fimg').value||null,foto_urls:$('fphotos').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),foto_gallery:$('fphotos').value.split(/\n+/).map(x=>x.trim()).filter(Boolean)});toast('Mezzo aggiunto');e.target.reset();fleet();stats()};$('tripForm').onsubmit=async e=>{e.preventDefault();await insertRow('tratte',{titolo:$('ttit').value,data_partenza:$('tdate').value||null,modello_bus:$('tbus').value||null,immagine_url:$('timg').value||null});toast('Partenza aggiunta');e.target.reset();trips();stats()};$('galleryForm').onsubmit=async e=>{e.preventDefault();await insertRow('gallery_eventi',{titolo:$('gtit').value,data_evento:$('gdate').value||null,foto_urls:$('gphotos').value.split(/\n+/).map(x=>x.trim()).filter(Boolean)});toast('Gallery salvata');gallery();stats()};$('carouselForm').onsubmit=async e=>{e.preventDefault();const old=await siteFetch('carousel_home',{limit:1});const p={foto_urls:$('cphotos').value.split(/\n+/).map(x=>x.trim()).filter(Boolean)};if(old[0])await updateRow('carousel_home',old[0].id,p);else await insertRow('carousel_home',p);toast('Carousel aggiornato')};$('infoForm').onsubmit=async e=>{e.preventDefault();const old=await siteFetch('info_azienda',{limit:1});if(old[0])await updateRow('info_azienda',old[0].id,{storia:$('story').value});else await insertRow('info_azienda',{storia:$('story').value});toast('Informazioni salvate')};initApp();</script></body></html>
