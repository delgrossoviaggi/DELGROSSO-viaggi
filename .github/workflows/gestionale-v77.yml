name: V77 safe historical PDF review
on:
  pull_request:
    paths:
      - 'GESTIONALE/index.html'
      - 'GESTIONALE/dg66-email-verifica.js'
      - 'GESTIONALE/dg75-integrita.js'
      - 'GESTIONALE/sw.js'
      - 'tests/gestionale-v77-safe-history-smoke.mjs'
      - 'tests/gestionale-v76-archives-smoke.mjs'
      - 'tests/gestionale-v75-integrity-smoke.mjs'
      - '.github/workflows/gestionale-v77.yml'
  push:
    branches: [main]
    paths:
      - 'GESTIONALE/index.html'
      - 'GESTIONALE/dg66-email-verifica.js'
      - 'GESTIONALE/dg75-integrita.js'
      - 'GESTIONALE/sw.js'
      - 'tests/gestionale-v77-safe-history-smoke.mjs'
      - 'tests/gestionale-v76-archives-smoke.mjs'
      - 'tests/gestionale-v75-integrity-smoke.mjs'
      - '.github/workflows/gestionale-v77.yml'
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prevent duplicate PDF issues for already-generated confirmations
        run: node tests/gestionale-v77-safe-history-smoke.mjs
      - name: Verify archived PDF review and refunds
        run: node tests/gestionale-v76-archives-smoke.mjs
      - name: Verify passenger seat integrity
        run: node tests/gestionale-v75-integrity-smoke.mjs
      - name: Verify responsive synchronization
        run: node tests/gestionale-v74-health-smoke.mjs
      - name: Verify operator communications access
        run: node tests/gestionale-v76-security-smoke.mjs
      - name: Verify booking deletion safeguards
        run: node tests/booking-delete-safe-smoke.mjs
      - name: Verify manual WhatsApp group invitations
        run: node tests/whatsapp-consent-invite-smoke.mjs
