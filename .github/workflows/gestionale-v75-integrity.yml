name: V75 booking-seat and archive integrity
on:
  push:
    branches: [main]
    paths:
      - 'GESTIONALE/index.html'
      - 'GESTIONALE/dg75-integrita.js'
      - 'GESTIONALE/sw.js'
      - 'tests/gestionale-v75-integrity-smoke.mjs'
      - 'supabase/patches/v75_restore_known_seat_index_rows_20261103.sql'
      - '.github/workflows/gestionale-v75-integrity.yml'
  pull_request:
    paths:
      - 'GESTIONALE/index.html'
      - 'GESTIONALE/dg75-integrita.js'
      - 'GESTIONALE/sw.js'
      - 'tests/gestionale-v75-integrity-smoke.mjs'
      - 'supabase/patches/v75_restore_known_seat_index_rows_20261103.sql'
      - '.github/workflows/gestionale-v75-integrity.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no unapproved changes to seats or documents
        run: node tests/gestionale-v75-integrity-smoke.mjs
      - name: Check V74 responsive sync regression
        run: node tests/gestionale-v74-health-smoke.mjs
      - name: Check booking safety
        run: node tests/booking-delete-safe-smoke.mjs
      - name: Check WhatsApp manual group invitations
        run: node tests/whatsapp-consent-invite-smoke.mjs
      - name: Check archived PDF recovery
        run: node tests/whatsapp-pdf-direct-storage-smoke.mjs
