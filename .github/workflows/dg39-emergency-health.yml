name: DG40 Emergency Production Read-only Web Health
on:
  push:
    paths:
      - ".github/workflows/dg39-emergency-health.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-published-files:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify static live pages and offline catalog on both frontend and management routes
        shell: bash
        run: |
          set -euo pipefail
          for path in /viaggi.html /GESTIONALE/index.html /GESTIONALE/suite/index.html /GESTIONALE/delgrosso-logo-originale-bianco.png /assets/viaggi-fallback-20261117.json /js/gestionale.js; do
            status="$(curl -Ls --output /dev/null --write-out '%{http_code}' --max-time 20 "https://www.delgrossoviaggi.it$path")"
            printf '%s %s\n' "$status" "$path"
            test "$status" = 200
          done
          curl -Ls --show-error --fail --max-time 20 'https://www.delgrossoviaggi.it/assets/viaggi-fallback-20261117.json' >/tmp/dg40-live.json
          node -e "
            const a=require('/tmp/dg40-live.json');
            if(!Array.isArray(a.trips)||a.trips.length<8)throw Error('No temporary catalog visible');
            if(a.trips.some(x=>x.offline_catalog!==true))throw Error('Unsafe false-live catalog');
            console.log('LIVE STATIC PASS: '+a.trips.length+' verified published trips.');
          "
