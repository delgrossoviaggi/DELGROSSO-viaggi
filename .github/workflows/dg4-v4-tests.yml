name: DG4 Rebuild — Offline Quality Gate
on:
  push:
    branches:
      - build/dg4-rebuild-20261117
    paths:
      - 'GESTIONALE/v4/**'
      - 'tests/dg4-v4*.test.mjs'
      - '.github/workflows/dg4-v4-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Node version
        run: node --version
      - name: Parse core and app
        run: |
          node --check GESTIONALE/v4/core.js
          node --check GESTIONALE/v4/app.js
          node --check GESTIONALE/v4/layout-editor.js
          node --check GESTIONALE/v4/pdf-engine.js
          node --check GESTIONALE/v4/pdf-reports.js
          node --check GESTIONALE/v4/booking-operations.js
          node --check GESTIONALE/v4/confirmation-groups.js
          node --check GESTIONALE/v4/live-sync.js
          node --check GESTIONALE/v4/bis-manual.js
          node --check GESTIONALE/v4/credit-transfers.js
          node --check GESTIONALE/v4/agenda-model.js
          node --check GESTIONALE/v4/layout-operations.js
      - name: Unit and rendering tests (offline)
        run: node --test tests/dg4-v4-core.test.mjs tests/dg4-v4-layouts.test.mjs tests/dg4-v4-pdf.test.mjs tests/dg4-v4-booking-operations.test.mjs tests/dg4-v4-confirmations.test.mjs tests/dg4-v4-live-sync.test.mjs tests/dg4-v4-bis-manual.test.mjs tests/dg4-v4-credit-transfers.test.mjs tests/dg4-v4-agenda-layout-crud.test.mjs
      - name: Forbid privileged credentials and accidental write unlock
        run: |
          if grep -E '^export const WRITES_ENABLED[[:space:]]*=[[:space:]]*true' GESTIONALE/v4/core.js; then echo 'ERROR: protected booking/accounting writes unlocked!'; exit 1; fi
          if grep -Er 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY|service_role[[:space:]]*:' GESTIONALE/v4 --include='*.js' --include='*.html'; then echo 'ERROR: privileged key reference in browser'; exit 1; fi

      - name: Package complete GitHub repository for manual upload
        run: |
          git archive --format=zip --output=DELGROSSO_VIAGGI_COMPLETO_V4_2026-11-17.zip HEAD
          unzip -tq DELGROSSO_VIAGGI_COMPLETO_V4_2026-11-17.zip
          test "$(git ls-files | wc -l | tr -d ' ')" -eq "$(unzip -Z1 DELGROSSO_VIAGGI_COMPLETO_V4_2026-11-17.zip | grep -vc '/ || {
            echo "ERROR: project archive does not contain every versioned file"; exit 1;
          }
          echo "Total versioned files: $(git ls-files | wc -l)"
          ls -lh DELGROSSO_VIAGGI_COMPLETO_V4_2026-11-17.zip
      - name: Publish full project ZIP for manual GitHub installation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DELGROSSO_VIAGGI_COMPLETO_V4_2026-11-17
          path: DELGROSSO_VIAGGI_COMPLETO_V4_2026-11-17.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
)" || {
            echo "ERROR: project archive does not contain every versioned file"; exit 1;
          }
          echo "Total versioned files: $(git ls-files | wc -l)"
          ls -lh DELGROSSO_VIAGGI_COMPLETO_V4_2026-11-17.zip
      - name: Publish full project ZIP for manual GitHub installation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DELGROSSO_VIAGGI_COMPLETO_V4_2026-11-17
          path: DELGROSSO_VIAGGI_COMPLETO_V4_2026-11-17.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
