name: DG29 piantine - safety checks

on:
  push:
    branches:
      - feat/dg3-piantine-integrita-20261115
  pull_request:
    paths:
      - 'GESTIONALE/assets/piantine-ufficiali-v28.js'
      - 'GESTIONALE/assets/supabase.js'
      - 'supabase/patches/dg29_immutable_layout_history_and_booked_trip_guard.sql'
      - 'tests/dg29-seat-layout-safety-smoke.mjs'
      - '.github/workflows/dg29-piantine-safety.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Static and functional smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax check - browser modules
        run: |
          node --check GESTIONALE/assets/piantine-ufficiali-v28.js
          node --check GESTIONALE/assets/supabase.js
      - name: Functional seat-template and publishing-safety smoke
        run: node tests/dg29-seat-layout-safety-smoke.mjs
