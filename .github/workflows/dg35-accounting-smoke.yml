name: DG35 Accounting Safety Smoke
on:
  push:
    paths:
      - "GESTIONALE/contabilita-operativa.html"
      - "tests/dg35-accounting-smoke.mjs"
      - ".github/workflows/dg35-accounting-smoke.yml"
  pull_request:
    paths:
      - "GESTIONALE/contabilita-operativa.html"
      - "tests/dg35-accounting-smoke.mjs"
      - ".github/workflows/dg35-accounting-smoke.yml"
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/dg35-accounting-smoke.mjs
