name: Booking and PDF regression checks
on:
  pull_request:
    paths:
      - 'js/ricevuta.js'
      - 'tests/pdf-smoke.mjs'
      - 'tests/booking-page-smoke.mjs'
      - 'prenota.html'
      - 'js/gestionale.js'
      - 'supabase/functions/send-booking-confirmation/index.ts'
      - '.github/workflows/pdf-smoke.yml'
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'js/ricevuta.js'
      - 'tests/pdf-smoke.mjs'
      - 'tests/booking-page-smoke.mjs'
      - 'prenota.html'
      - 'js/gestionale.js'
      - 'supabase/functions/send-booking-confirmation/index.ts'
      - '.github/workflows/pdf-smoke.yml'
permissions:
  contents: read
jobs:
  pdf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate booking PDF
        run: |
          node tests/pdf-smoke.mjs
          node tests/booking-page-smoke.mjs
