name: V79 - Departure day financial PDF
on:
  pull_request:
    paths:
      - 'GESTIONALE/index.html'
      - 'GESTIONALE/dg79-partenza-modello.js'
      - 'GESTIONALE/dg79-partenza-pdf.js'
      - 'GESTIONALE/dg79-riepilogo-partenza.js'
      - 'GESTIONALE/sw.js'
      - 'tests/gestionale-v79-riepilogo-partenza-smoke.mjs'
      - '.github/workflows/gestionale-v79.yml'
  push:
    branches: [main]
    paths:
      - 'GESTIONALE/index.html'
      - 'GESTIONALE/dg79-partenza-modello.js'
      - 'GESTIONALE/dg79-partenza-pdf.js'
      - 'GESTIONALE/dg79-riepilogo-partenza.js'
      - 'GESTIONALE/sw.js'
      - 'tests/gestionale-v79-riepilogo-partenza-smoke.mjs'
      - '.github/workflows/gestionale-v79.yml'
permissions:
  contents: read
jobs:
  departure-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test PDF math, passenger seats and operator shares
        run: node tests/gestionale-v79-riepilogo-partenza-smoke.mjs
      - name: Test V78 protected PDF archive
        run: node tests/gestionale-v78-archivio-storico-smoke.mjs
      - name: Test V77 duplicate-document protections
        run: node tests/gestionale-v77-safe-history-smoke.mjs
      - name: Test V76 receipt and reimbursement checks
        run: node tests/gestionale-v76-archives-smoke.mjs
      - name: Test V75 assigned seats
        run: node tests/gestionale-v75-integrity-smoke.mjs
      - name: Test V74 mobile synchronization
        run: node tests/gestionale-v74-health-smoke.mjs
      - name: Test booking deletion accounting safety
        run: node tests/booking-delete-safe-smoke.mjs
      - name: Test WhatsApp voluntary group links
        run: node tests/whatsapp-consent-invite-smoke.mjs
