name: V78 historical archive and cross-device regressions
on:
  push:
    branches: [main]
    paths:
      - 'GESTIONALE/index.html'
      - 'GESTIONALE/dg75-integrita.js'
      - 'GESTIONALE/dg78-archivio-storico.js'
      - 'GESTIONALE/sw.js'
      - 'tests/gestionale-v78-archivio-storico-smoke.mjs'
      - 'tests/gestionale-v77-safe-history-smoke.mjs'
      - 'tests/gestionale-v75-integrity-smoke.mjs'
      - 'tests/gestionale-v76-archives-smoke.mjs'
      - '.github/workflows/gestionale-v78.yml'
  pull_request:
    paths:
      - 'GESTIONALE/index.html'
      - 'GESTIONALE/dg75-integrita.js'
      - 'GESTIONALE/dg78-archivio-storico.js'
      - 'GESTIONALE/sw.js'
      - 'tests/gestionale-v78-archivio-storico-smoke.mjs'
      - 'tests/gestionale-v77-safe-history-smoke.mjs'
      - 'tests/gestionale-v75-integrity-smoke.mjs'
      - 'tests/gestionale-v76-archives-smoke.mjs'
      - '.github/workflows/gestionale-v78.yml'
permissions:
  contents: read
jobs:
  historical-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V78 archived PDF reconciliation and safe signed links
        run: node tests/gestionale-v78-archivio-storico-smoke.mjs
      - name: Verify V77 duplicate prevention
        run: node tests/gestionale-v77-safe-history-smoke.mjs
      - name: Verify V76 document filters and reimbursement protection
        run: node tests/gestionale-v76-archives-smoke.mjs
      - name: Verify V75 passenger seats and document totals
        run: node tests/gestionale-v75-integrity-smoke.mjs
      - name: Verify V74 responsive and background synchronization
        run: node tests/gestionale-v74-health-smoke.mjs
      - name: Verify booking deletion and payment integrity
        run: node tests/booking-delete-safe-smoke.mjs
      - name: Verify WhatsApp consent and manual invitations
        run: node tests/whatsapp-consent-invite-smoke.mjs
