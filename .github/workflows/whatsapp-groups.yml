name: WhatsApp group invitation regression
on:
  push:
    branches: [main]
    paths:
      - 'GESTIONALE/dg61-quote-whatsapp.js'
      - 'GESTIONALE/dg68-gruppi-viaggio.js'
      - 'GESTIONALE/dg67-whatsapp-pdf.js'
      - 'tests/whatsapp-pdf-ios-recovery-smoke.mjs'
      - 'GESTIONALE/dg63-whatsapp-gratis.js'
      - 'GESTIONALE/index.html'
      - 'tests/whatsapp-consent-invite-smoke.mjs'
      - 'tests/whatsapp-group-invite-smoke.mjs'
      - '.github/workflows/whatsapp-groups.yml'
  pull_request:
    paths:
      - 'GESTIONALE/dg61-quote-whatsapp.js'
      - 'GESTIONALE/dg68-gruppi-viaggio.js'
      - 'GESTIONALE/dg67-whatsapp-pdf.js'
      - 'tests/whatsapp-pdf-ios-recovery-smoke.mjs'
      - 'GESTIONALE/dg63-whatsapp-gratis.js'
      - 'GESTIONALE/index.html'
      - 'tests/whatsapp-consent-invite-smoke.mjs'
      - 'tests/whatsapp-group-invite-smoke.mjs'
      - '.github/workflows/whatsapp-groups.yml'
permissions:
  contents: read
jobs:
  validate-whatsapp-group-invites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test group link validation and saving
        run: node tests/whatsapp-group-invite-smoke.mjs
      - name: Test explicit group consent and manual invitation
        run: node tests/whatsapp-consent-invite-smoke.mjs
      - name: Test iPhone PDF existing-document recovery
        run: node tests/whatsapp-pdf-ios-recovery-smoke.mjs
