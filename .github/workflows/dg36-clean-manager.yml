name: DG36 Clean Gestionale Smoke
on:
  push:
    paths:
      - "GESTIONALE/nuovo/**"
      - "tests/dg36-clean-manager-smoke.mjs"
      - ".github/workflows/dg36-clean-manager.yml"
  pull_request:
    paths:
      - "GESTIONALE/nuovo/**"
      - "tests/dg36-clean-manager-smoke.mjs"
      - ".github/workflows/dg36-clean-manager.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify new manager and financial ledger
        run: node tests/dg36-clean-manager-smoke.mjs
