name: DG41 actual public catalog
on:
  push:
    paths:
      - "js/future-v4.js"
      - "index.html"
      - "viaggi.html"
      - "viaggio.html"
      - "tests/dg41-public-catalog.mjs"
      - ".github/workflows/dg41-public-catalog.yml"
  pull_request:
    paths:
      - "js/future-v4.js"
      - "tests/dg41-public-catalog.mjs"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/dg41-public-catalog.mjs
