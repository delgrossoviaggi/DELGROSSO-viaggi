name: Sito pubblico 2026
on:
  push:
    paths:
      - "*.html"
      - "js/sito.js"
      - "js/prenota.js"
      - "js/gestionale.js"
      - "assets/sito.css"
      - "tests/sito-2026.mjs"
      - ".github/workflows/dg41-public-catalog.yml"
  pull_request:
    paths:
      - "*.html"
      - "js/sito.js"
      - "js/prenota.js"
      - "assets/sito.css"
      - "tests/sito-2026.mjs"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/sito-2026.mjs
