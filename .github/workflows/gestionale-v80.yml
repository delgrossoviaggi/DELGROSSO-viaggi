name: V80 - Contanti per viaggio Nicola e Raffaele
on:
  pull_request:
    paths:
      - 'GESTIONALE/index.html'
      - 'GESTIONALE/sw.js'
      - 'GESTIONALE/dg80-contanti-modello.js'
      - 'GESTIONALE/dg80-contanti-viaggi.js'
      - 'GESTIONALE/dg80-contanti.css'
      - 'tests/gestionale-v80-contanti-viaggi-smoke.mjs'
      - 'tests/gestionale-v79-riepilogo-partenza-smoke.mjs'
      - '.github/workflows/gestionale-v80.yml'
  push:
    branches: [main]
    paths:
      - 'GESTIONALE/index.html'
      - 'GESTIONALE/sw.js'
      - 'GESTIONALE/dg80-contanti-modello.js'
      - 'GESTIONALE/dg80-contanti-viaggi.js'
      - 'GESTIONALE/dg80-contanti.css'
      - 'tests/gestionale-v80-contanti-viaggi-smoke.mjs'
      - 'tests/gestionale-v79-riepilogo-partenza-smoke.mjs'
      - '.github/workflows/gestionale-v80.yml'
permissions:
  contents: read
jobs:
  contanti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contanti per viaggio e nomi paganti
        run: node tests/gestionale-v80-contanti-viaggi-smoke.mjs
      - name: PDF partenza e quote operatori
        run: node tests/gestionale-v79-riepilogo-partenza-smoke.mjs
      - name: Protezione prenotazioni e cassa
        run: node tests/booking-delete-safe-smoke.mjs
      - name: Controlli V74 caricamento rapido
        run: node tests/gestionale-v74-health-smoke.mjs
      - name: WhatsApp e consensi
        run: node tests/whatsapp-consent-invite-smoke.mjs
      - name: Controllo storico posti
        run: node tests/gestionale-v75-integrity-smoke.mjs
