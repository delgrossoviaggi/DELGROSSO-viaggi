name: V74 stability and PDF checks
on:
  pull_request:
    paths:
      - 'GESTIONALE/index.html'
      - 'GESTIONALE/dg66-email-verifica.js'
      - 'GESTIONALE/sw.js'
      - 'tests/gestionale-v74-health-smoke.mjs'
      - 'tests/admin-recovery-smoke.mjs'
      - '.github/workflows/gestionale-v74-health.yml'
  push:
    branches: [main]
    paths:
      - 'GESTIONALE/index.html'
      - 'GESTIONALE/dg66-email-verifica.js'
      - 'GESTIONALE/sw.js'
      - 'tests/gestionale-v74-health-smoke.mjs'
      - 'tests/admin-recovery-smoke.mjs'
      - '.github/workflows/gestionale-v74-health.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test mobile sync and archived-PDF UI
        run: node tests/gestionale-v74-health-smoke.mjs
      - name: Test confirmation PDF recovery
        run: node tests/admin-recovery-smoke.mjs
      - name: Test booking deletion remains safe
        run: node tests/booking-delete-safe-smoke.mjs
      - name: Test group consent and manual invite
        run: node tests/whatsapp-consent-invite-smoke.mjs
